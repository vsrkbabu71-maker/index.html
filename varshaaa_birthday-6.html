<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Varshaaa 💗</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:Georgia,serif;
  background:radial-gradient(circle at 50% 35%,#fff7fb,#f8d9e8 45%,#e8b8d0 100%);
  color:#6d3150;
}
.card{
  width:min(88vw,520px); padding:55px 28px;
  text-align:center; border-radius:30px;
  background:rgba(255,255,255,.48);
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(110,45,80,.18);
  border:1px solid rgba(255,255,255,.75);
  animation:appear 1.4s ease;
}
.small{font-family:Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;font-size:12px;opacity:.65}
h1{
  margin:18px 0 12px; font-size:clamp(38px,10vw,66px);
  font-weight:500; line-height:1.05;
  animation:glow 2.5s ease-in-out infinite alternate;
}
p{font-family:Arial,sans-serif;font-size:18px;letter-spacing:.5px;margin:0}
.heart{font-size:30px;margin-top:25px;animation:beat 1.4s infinite}
.float{position:absolute;animation:float 7s linear infinite;opacity:.65;font-size:24px}
.f1{left:8%;bottom:-30px}.f2{left:25%;top:-30px;animation-delay:2s}.f3{right:12%;bottom:-30px;animation-delay:4s}.f4{right:25%;top:-30px;animation-delay:1s}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:none}}
@keyframes glow{from{text-shadow:0 0 4px #fff}to{text-shadow:0 0 20px rgba(210,100,150,.45)}}
@keyframes beat{50%{transform:scale(1.18)}}
@keyframes float{to{transform:translateY(-115vh) rotate(25deg)}}
</style>
</head>
<body>
<div class="float f1">♡</div><div class="float f2">✦</div>
<div class="float f3">♡</div><div class="float f4">✧</div>
<div class="card">
  <div class="small">A little birthday wish</div>
  <h1>Varshaaa,<br>be happy ♡</h1>
  <p>Happy Birthday 🎂✨</p>
  <div class="heart">💗</div>
</div>
</body>
</html>
